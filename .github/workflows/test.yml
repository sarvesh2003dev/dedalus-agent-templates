name: Verify examples and preserved source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r examples/persistent-data-agent/requirements.txt
      - run: python -m unittest discover -s examples/persistent-data-agent/tests -v
      - run: python -m unittest discover -s tests -v
      - run: python examples/persistent-data-agent/deploy.py local-demo
